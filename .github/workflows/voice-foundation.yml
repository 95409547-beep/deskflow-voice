name: Voice foundation
on:
  push:
    branches: [main, 'feature/**']
    paths: ['src/lib/voice/**', 'components/windows-voice/**', '.github/workflows/voice-foundation.yml']
  pull_request:
    paths: ['src/lib/voice/**', 'components/windows-voice/**', '.github/workflows/voice-foundation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  session:
    strategy:
      matrix:
        os: [macos-15, windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - run: cmake -S src/lib/voice -B build/voice -DBUILD_TESTING=ON
      - run: cmake --build build/voice --config Release
      - run: ctest --test-dir build/voice -C Release --output-on-failure
  windows-component:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.400'
      - name: Build, managed checks and self-contained publish
        shell: pwsh
        run: ./components/windows-voice/build.ps1 -Publish
